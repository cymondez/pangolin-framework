# M5 corrective acceptance overlay: adds MySQL on top of deploy/compose/m1.yaml.
# postgres/nats/test-idp stay untouched in the base file. Start the combined
# stack with: docker compose -p <project> -f deploy/compose/m1.yaml -f deploy/compose/m5-databases.yaml up -d --wait
x-mysql-limits: &mysql-limits
  restart: "no"
  cpus: 0.5
  pids_limit: 128
  labels:
    dev.pangolin.owner: pangolin-framework
    dev.pangolin.purpose: m5-databases
    dev.pangolin.source-commit: "${PANGOLIN_SOURCE_COMMIT:-working-tree}"

services:
  mysql:
    <<: *mysql-limits
    image: ${PANGOLIN_M5_MYSQL_IMAGE:-mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902}
    mem_limit: 512m
    environment:
      MYSQL_DATABASE: pangolin_db_contracts
      MYSQL_USER: pangolin_database
      MYSQL_PASSWORD: local-database-only
      MYSQL_ROOT_PASSWORD: local-root-only
    ports:
      - "127.0.0.1:${PANGOLIN_M5_MYSQL_PORT:-15543}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 2s
      timeout: 2s
      retries: 45

volumes:
  mysql-data:
